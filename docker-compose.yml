version: '3'

services:
  db:
    image: mongo:latest
    command: bash -c "mongod --bind_ip_all || (mongod --repair && mongod --bind_ip_all)"
    volumes:
      - ./db:/data/db
      - ./dump:/dump
    ports:
      - "27017:27017"
    networks:
      - my-network
  app:
    image: node:latest
    command: bash -c "npm run dev"
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - my-network

networks:
  my-network:
